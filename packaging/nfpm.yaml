# `make dist` fills in @NAME@, @BINARY@ and @DIST@ and sets ARCH and VERSION.
name: "@NAME@"
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: mi4uu <mi4uu@users.noreply.github.com>
description: |-
  WhatsApp archive and MCP server.
  Keeps your whole WhatsApp history on your own disk with full-text search
  and gives AI assistants read-only access over MCP. Sending is opt-in.
vendor: mi4uu
homepage: https://github.com/mi4uu/whatsupd
license: AGPL-3.0-or-later
contents:
  - src: "@BINARY@"
    dst: /usr/bin/@NAME@
    file_info:
      mode: 0755
  - src: "@DIST@/.@NAME@.service"
    dst: /usr/lib/systemd/user/@NAME@.service
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/@NAME@/LICENSE
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/@NAME@/README.md
    file_info:
      mode: 0644
scripts:
  postinstall: "@DIST@/.postinstall.sh"
