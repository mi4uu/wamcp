name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Issues are public: leave out phone numbers, names, message text and tokens.
        For a security problem, use [a private report](https://github.com/mi4uu/whatsupd/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: whatsupd version
      description: "`whatsupd version`, or Settings > About in the web client."
      placeholder: v0.2.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: linux/amd64, go1.26.0
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Setup
      description: How whatsupd runs, for example background service, stdio or HTTP, send on or off, OAuth on or off, which MCP client.
      placeholder: background service, Claude Desktop over stdio, MCP read-only
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. whatsupd serve
        2. ...
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: From `~/.whatsupd/logs/whatsupd.log` or the terminal. Remove phone numbers and message text first.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed phone numbers, names, message text and tokens from this report.
          required: true
