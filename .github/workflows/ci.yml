name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - run: go test -race ./...
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make dist VERSION=v0.0.0-ci
      - name: Install the .deb and run it
        run: |
          sudo dpkg -i dist/v0.0.0-ci/wamcp_0.0.0~ci_amd64.deb
          wamcp version | grep -q v0.0.0-ci
          test -f /usr/lib/systemd/user/wamcp.service
          cd dist/v0.0.0-ci && sha256sum -c SHA256SUMS
      - name: Install the .rpm on Fedora and run it
        run: |
          docker run --rm -v "$PWD/dist/v0.0.0-ci:/d:ro" fedora:44 sh -ec '
            rpm -i /d/*.x86_64.rpm
            wamcp version | grep -q v0.0.0-ci
            test -f /usr/lib/systemd/user/wamcp.service
            rpm -e wamcp
            ! test -e /usr/bin/wamcp'
      - name: Install the Arch package and run it
        run: |
          docker run --rm -v "$PWD/dist/v0.0.0-ci:/d:ro" archlinux:latest sh -ec '
            pacman -U --noconfirm /d/*-x86_64.pkg.tar.zst
            wamcp version | grep -q v0.0.0-ci
            test -f /usr/lib/systemd/user/wamcp.service
            pacman -R --noconfirm wamcp
            ! test -e /usr/bin/wamcp'
