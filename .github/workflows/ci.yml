name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - run: go test -race ./...
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make dist VERSION=v0.0.0-ci
      - name: Install the .deb and run it
        run: |
          sudo dpkg -i dist/v0.0.0-ci/whatsupd_0.0.0~ci_amd64.deb
          whatsupd version | grep -q v0.0.0-ci
          test -f /usr/lib/systemd/user/whatsupd.service
          cd dist/v0.0.0-ci && sha256sum -c SHA256SUMS
      - name: Install the .rpm on Fedora and run it
        run: |
          docker run --rm -v "$PWD/dist/v0.0.0-ci:/d:ro" fedora:44 sh -ec '
            rpm -i /d/*.x86_64.rpm
            whatsupd version | grep -q v0.0.0-ci
            test -f /usr/lib/systemd/user/whatsupd.service
            rpm -e whatsupd
            ! test -e /usr/bin/whatsupd'
      - name: Install the Arch package and run it
        run: |
          docker run --rm -v "$PWD/dist/v0.0.0-ci:/d:ro" archlinux:latest sh -ec '
            pacman -U --noconfirm /d/*-x86_64.pkg.tar.zst
            whatsupd version | grep -q v0.0.0-ci
            test -f /usr/lib/systemd/user/whatsupd.service
            pacman -R --noconfirm whatsupd
            ! test -e /usr/bin/whatsupd'
  upgrade:
    # An install from before the rename to whatsupd, running as a systemd user
    # service, must upgrade in place.
    runs-on: ubuntu-latest
    env:
      OLD_COMMIT: f1f59672a3da1627cbeb33f7b0528bc70f329d31
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the old wamcp and the new whatsupd
        run: |
          git fetch --depth=1 origin "$OLD_COMMIT"
          mkdir -p /tmp/old
          git archive FETCH_HEAD | tar -x -C /tmp/old
          (cd /tmp/old && CGO_ENABLED=0 go build -o /tmp/wamcp ./cmd/wamcp)
          CGO_ENABLED=0 go build -o /tmp/whatsupd ./cmd/whatsupd
      - name: Start a systemd user session
        run: |
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 30); do test -S "/run/user/$(id -u)/bus" && break; sleep 1; done
          XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user is-system-running --wait || true
      - run: XDG_RUNTIME_DIR="/run/user/$(id -u)" scripts/upgrade-test.sh /tmp/wamcp /tmp/whatsupd
