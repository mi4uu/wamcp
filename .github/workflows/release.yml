name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Passed through the environment, never interpolated into a script:
      # a tag name is untrusted input.
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Check tag
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "release tags look like v1.2.3 or v1.2.3-rc.1, got: $VERSION" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: make dist VERSION="$VERSION"
      - run: gh release create "$VERSION" --verify-tag --generate-notes "dist/$VERSION"/*.tar.gz "dist/$VERSION/SHA256SUMS"
        env:
          GH_TOKEN: ${{ github.token }}
